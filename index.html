<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="Zhuravlyova">
        <div class="header">
            <div class="container">
                <div class="decor--rotate">
                    <img src="img/decor.png" alt="">
                </div>
                <div class="logo">
                    <h1>HAIR BY ZHURAVLYOVA</h1>
                </div>
                <div class="decor">
                    <img src="img/decor.png" alt="">
                </div>
            </div>
        </div>
        <div class="hero">
            <div class="container">
                <div class="hero__block">
                    <div class="hero__left">
                        <div class="photo">
                            <div class="photo__wrapper">
                                <div class="photo__bg"></div>
                                <img src="img/mainImg.png" alt="Колорист" />
                            </div>
                        </div>
                        <div class="button button-hero">
                            <div class="button__decor">
                                <img src="img/buttonDecor.png" alt="">
                            </div>
                            <div class="button__border">
                                <button class="button__main">
                                    Отримати процедуру
                                </button>
                            </div>
                            <div class="button__decor--rotate">
                                <img src="img/buttonDecor.png" alt="">
                            </div>
                        </div>
                    </div>
                    <div class="hero__right">
                        <div class="hero__main-text">
                            <h2>
                                Створюю красу для жінок
                            </h2>
                            <h3>
                                Колорист • Складні техніки • Відновлення волосся
                            </h3>
                        </div>
                        <div class="images">
                            <div class="images__wrapper">
                                <div class="images__bg">
                                    <div class="images__inner"></div>
                                </div>
                                <img src="img/hero1.png" alt="Колорист" />
                                <div class="icons">
                                    <img src="img/telegram.svg" alt="">
                                </div>
                            </div>
                        </div>
                        <div class="icons">
                            <svg class="icon icon__insta" width="40" height="40" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="0.25" y="0.25" width="29.5" height="29.5" fill="#FCFBFA" stroke="black" stroke-width="0.5"/>
                                <rect class="inside" x="2.75" y="2.75" width="24.5" height="24.5" fill="#FCFBFA" stroke="black" stroke-width="0.5"/>
                                <circle cx="14.5833" cy="15.417" r="6.25" fill="#100F0F"/>
                                <circle cx="22.9166" cy="7.91634" r="2.08333" fill="#100F0F"/>
                            </svg>
                            <svg class="icon icon__telegram" width="40" height="40" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="0.25" y="0.25" width="29.5" height="29.5" fill="#FCFBFA" stroke="black" stroke-width="0.5"/>
                                <rect class="inside" x="2.75" y="2.74969" width="24.5" height="24.5" fill="#FCFBFA" stroke="black" stroke-width="0.5"/>
                                <path class="plane-stroke" d="M3.86911 19.2309L26.9406 5.93688L19.73 26.5236L16.3835 20.8543L3.86911 19.2309Z" stroke="black" stroke-width="0.5"/>
                                <path class="plane-wing" d="M26.645 6.14865C25.0165 8.18102 20.9993 13.9611 16.5455 20.8366L19.7818 26.4969L26.645 6.14865Z" fill="#100F0F" stroke="black" stroke-width="0.5"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
